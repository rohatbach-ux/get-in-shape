<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Get in Shape</title>
  <meta name="description" content="Trainings- und Ernährungsplan für Rohat und Steffi">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Get in Shape">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="view-title">Training</h1>
    <div class="profile-switch" role="tablist" aria-label="Person">
      <button data-profile="rohat" role="tab">Rohat</button>
      <button data-profile="steffi" role="tab">Steffi</button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Bereiche">
    <button data-tab="training"><span class="ico" aria-hidden="true">🏃</span>Training</button>
    <button data-tab="essen"><span class="ico" aria-hidden="true">🥗</span>Essen</button>
    <button data-tab="einkauf"><span class="ico" aria-hidden="true">🛒</span>Einkauf</button>
    <button data-tab="mehr"><span class="ico" aria-hidden="true">⚙️</span>Mehr</button>
  </nav>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
